<!doctype html><html><head><script>localStorage.setItem('supportflow-theme','dark')</script><script src="/theme-init.js"></script><script>window.earlyDark=document.documentElement.classList.contains('dark')</script></head><body><div id="root"></div><pre id="result">RUNNING</pre>
<script type="module">
import React from 'react'
import {createRoot} from 'react-dom/client'
import ThemeProvider from '/src/theme/ThemeProvider.jsx'
import {useTheme} from '/src/theme/ThemeContext.js'
import WorkspaceHeader from '/src/layouts/WorkspaceHeader.jsx'
import '/src/index.css'
const h=React.createElement,wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(ok,msg)=>{if(!ok)throw Error(msg)}
let state
window.matchMedia=()=>{throw Error('Theme must not read OS preference')}
function Fixture(){state=useTheme();return h(WorkspaceHeader,{title:'My Tickets',displayName:'Malith Perera with a long display name',role:'Admin'})}
const root=createRoot(document.querySelector('#root')),toggle=()=>document.querySelector('button')
try{
 check(window.earlyDark,'early saved dark application')
 root.render(h(ThemeProvider,null,h(Fixture)));await wait(100)
 check(state.theme==='dark'&&!('resolvedTheme' in state),'only current theme exposed')
 check(toggle().getAttribute('aria-label')==='Switch to light mode','dark label')
 toggle().click();await wait(250);check(state.theme==='light'&&localStorage.getItem('supportflow-theme')==='light','one click light and persistence')
 toggle().click();await wait(250);check(state.theme==='dark'&&localStorage.getItem('supportflow-theme')==='dark','one click dark and persistence')
 check(document.querySelectorAll('button').length===1&&!document.querySelector('select'),'one control without menu')
 for(const theme of ['light','dark']){state.setTheme(theme);await wait(250);for(const width of [320,375,768,1440]){document.querySelector('#root').style.width=width+'px';await wait(30);check(document.querySelector('#root').scrollWidth<=width,'no overflow '+theme+' '+width);check(toggle().getBoundingClientRect().width===80,'compact width')}}
 window.dispatchEvent(new StorageEvent('storage',{key:'supportflow-theme',newValue:'light'}));await wait(50);check(state.theme==='light','cross-tab light')
 window.dispatchEvent(new StorageEvent('storage',{key:'supportflow-theme',newValue:'dark'}));await wait(50);check(state.theme==='dark','cross-tab dark')
 window.dispatchEvent(new StorageEvent('storage',{key:'supportflow-theme',newValue:'system'}));await wait(50);check(state.theme==='light','legacy preference fallback')
 root.render(null);await wait(50);localStorage.removeItem('supportflow-theme');root.render(h(ThemeProvider,null,h(Fixture)));await wait(50);check(state.theme==='light','default light')
 root.render(null);await wait(50)
 const get=Storage.prototype.getItem,set=Storage.prototype.setItem
 Storage.prototype.getItem=()=>{throw Error('blocked')};Storage.prototype.setItem=()=>{throw Error('blocked')}
 root.render(h(ThemeProvider,null,h(Fixture)));await wait(50);check(state.theme==='light','blocked storage default');toggle().click();await wait(50);check(state.theme==='dark','in-memory toggle without storage')
 Storage.prototype.getItem=get;Storage.prototype.setItem=set
 document.querySelector('#result').textContent='PASS: single toggle, labels, persistence, startup, default/legacy fallback, no OS access, cross-tab sync, blocked storage and 320/375/768/1440px'
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}
</script></body></html>
